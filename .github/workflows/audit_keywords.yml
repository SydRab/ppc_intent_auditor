name: PPC Intent Auditor

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually trigger it anytime from the GitHub Actions tab

jobs:
  run-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Intent Auditor Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"  # Forces Python to print logs to console in real-time without buffering
        run: |
          python main.py

      - name: Upload Audit Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppc-audit-results
          path: |
            approved_campaign_keywords.csv
            auto_negative_keywords.csv

      - name: Commit and Push Clean Keywords
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add approved_campaign_keywords.csv auto_negative_keywords.csv
          git commit -m "Auto-generated clean campaign keywords and negative lists via Gemini API" || exit 0
          git push
