name: PPC Intent Auditor

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually trigger it anytime from the GitHub Actions tab

jobs:
  run-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Intent Auditor Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Commit and Push Clean Keywords
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add approved_campaign_keywords.csv
          git commit -m "Auto-generated clean campaign keywords via Gemini API" || exit 0
          git push
